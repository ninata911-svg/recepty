name: Assemble salad image

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/assemble-salat-image.yml"

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Assemble image
        shell: bash
        run: |
          set -euo pipefail
          cat assets/.tmp-salat-image/part1.b64 \
              assets/.tmp-salat-image/part2.b64 \
              assets/.tmp-salat-image/part3.b64 \
              assets/.tmp-salat-image/part4.b64 \
            | base64 --decode > assets/images/salat-s-myasom-shampinonami-solyonym-ogurcom.jpg
          test -s assets/images/salat-s-myasom-shampinonami-solyonym-ogurcom.jpg

      - name: Commit image
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/salat-s-myasom-shampinonami-solyonym-ogurcom.jpg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Add salad recipe image"
          git push

# trigger assembly
